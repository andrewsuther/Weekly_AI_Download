name: Weekly AI Digest

on:
  schedule:
    - cron: '0 18 * * 0'      # Sunday 18:00 UTC
  workflow_dispatch:            # Manual trigger for dev/testing

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          XAI_API_KEY:         ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:      ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL:   ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL:     ${{ secrets.RESEND_TO_EMAIL }}
        run: python src/main.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-digest-report
          path: |
            output/digest_report.md
            output/run_summary.json
            output/run.log.jsonl
