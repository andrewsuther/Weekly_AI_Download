name: Weekly AI Digest

on:
  schedule:
    - cron: '0 18 * * 0'      # Sunday 18:00 UTC
  workflow_dispatch:
    inputs:
      week_ending:
        description: 'Historical week ending (YYYY-MM-DD); blank means today'
        required: false
        type: string
      send:
        description: 'Send email after generation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-ai-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DELIVER_EMAIL:       ${{ (github.event_name == 'schedule' && github.run_attempt == 1) || inputs.send }}
      BACKFILL_WEEK:       ${{ inputs.week_ending }}
      XAI_API_KEY:         ${{ secrets.XAI_API_KEY }}
      ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY:      ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL:   ${{ secrets.RESEND_FROM_EMAIL }}
      RESEND_TO_EMAIL:     ${{ secrets.RESEND_TO_EMAIL }}
    steps:
      - name: Validate delivery configuration
        if: env.DELIVER_EMAIL == 'true'
        shell: bash
        run: |
          missing=()
          for name in RESEND_API_KEY RESEND_FROM_EMAIL RESEND_TO_EMAIL; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required Actions secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run digest pipeline
        shell: bash
        run: |
          args=()
          if [ -n "$BACKFILL_WEEK" ]; then
            args+=(--week-ending "$BACKFILL_WEEK")
          fi
          if [ "$DELIVER_EMAIL" != "true" ]; then args+=(--no-send); fi
          python src/main.py "${args[@]}"

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [ -f output/run_summary.json ]; then
            echo '## Weekly AI Digest run' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output/run_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: weekly-digest-report
          path: |
            output/digest_report.md
            output/run_summary.json
            output/run.log.jsonl
            output/delivery_receipt.json
          if-no-files-found: warn
          retention-days: 90
